<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VeraWall | Behavioral Intelligence for Fraud Prevention</title>
    <meta
      name="description"
      content="VeraWall's Behavioral Intelligence Platform disrupts scams, phishing, account takeover and money mule fraud in real time."
    />
    <link rel="canonical" href="https://verawall.tech/" />

    <!-- Link previews (WhatsApp, LinkedIn, Slack, X). These must live in the
         served HTML: preview crawlers do not execute JavaScript, so the
         client-side Seo component cannot provide them. The absolute URLs
         assume the production host — keep in sync with the deploy domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VeraWall" />
    <meta property="og:title" content="VeraWall | Behavioral Intelligence for Fraud Prevention" />
    <meta
      property="og:description"
      content="Real-time scam, account-takeover and money-mule detection for mobile-first banking — behavioral SDKs, scoring and in-app interventions."
    />
    <meta property="og:url" content="https://verawall.tech/" />
    <meta property="og:image" content="https://verawall.tech/verawall-logo-social.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="VeraWall | Behavioral Intelligence for Fraud Prevention" />
    <meta
      name="twitter:description"
      content="Real-time scam, account-takeover and money-mule detection for mobile-first banking."
    />
    <meta name="twitter:image" content="https://verawall.tech/verawall-logo-social.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "VeraWall",
        "url": "https://verawall.tech/",
        "logo": "https://verawall.tech/verawall-logo-social.png",
        "email": "contact@verawall.com",
        "description": "Behavioral intelligence platform for fraud prevention in mobile-first banking and mobile money: real-time scam, account-takeover and money-mule detection with in-app interventions."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
